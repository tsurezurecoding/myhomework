<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学習進度チェック</title>
    <link rel="stylesheet" href="./src/shared/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar compact-topbar">
        <div>
          <p class="eyebrow">学習進度チェック</p>
          <h1>学校の範囲から教材の対応を見る</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" id="scopeSettingsButton" type="button">範囲設定</button>
          <button class="primary-button" id="doneSettingsButton" type="button">完了して戻る</button>
          <button class="ghost-button" id="resetSampleButton" type="button">状態を戻す</button>
          <button class="ghost-button" id="exportButton" type="button">保存データを書き出す</button>
        </div>
      </header>

      <main>
        <section class="summary-line" id="summaryLine" aria-label="全体集計"></section>

        <nav class="subject-tabs" id="subjectTabs" aria-label="教科"></nav>

        <section class="panel board-panel" aria-label="教材対応表">
          <div class="quickbar" aria-label="絞り込み">
            <label class="compact-select">
              <span>範囲</span>
              <select id="schoolFilter">
                <option value="all">すべて</option>
                <option value="nextTest">次回テスト範囲まで</option>
                <option value="unlearned">未習</option>
                <option value="learned">学習済</option>
                <option value="test">テスト範囲</option>
              </select>
            </label>
            <label class="compact-select" id="materialFilterWrap">
              <span>教材</span>
              <select id="materialFilter">
                <option value="all">すべて</option>
                <option value="unfinished">未完了あり</option>
                <option value="checked">完了のみ</option>
              </select>
            </label>
            <span id="visibleCount" class="target-subject">0件</span>
          </div>
          <div class="legend" aria-label="凡例">
            <span><b class="dot school-unlearned"></b>未習</span>
            <span><b class="dot school-learned"></b>学習済</span>
            <span><b class="dot school-test"></b>テスト範囲</span>
            <span><b class="dot empty-dot"></b>教材未</span>
            <span><b class="dot done-dot"></b>済</span>
            <span><b class="dot checked-dot"></b>丸つけ済 / OK</span>
          </div>
          <div id="progressBoard" class="progress-board"></div>
        </section>
      </main>
    </div>

    <script src="./src/features/app-data.js"></script>
    <script src="./src/features/app.js"></script>
  </body>
</html>
